# 把构建产物发布到 GitHub Pages。
#
# 【为什么用 Actions 而不是手动推 gh-pages 分支】
# 手动推的话，每次发版都要在本地 build 一次、再推一次构建产物；
# 构建产物进了仓库历史，仓库会越来越胖。
# 用 Actions 是「推代码 → 云端构建 → 发布」，仓库里只有源码。
#
# 【第一次用之前要做的事】
# 仓库 Settings → Pages → Source 选 **GitHub Actions**。只做一次。
#
# 【一次部署发布两套站点】
#   /Program2026/        ← 主站（优化后）
#   /Program2026/naive/  ← v0-naive 那个 tag 的构建产物（优化前），用来看对比
# 两套在同一个产物里，所以同源、同一份 404 回退、同一次发布。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一次运行
  workflow_dispatch:

# 发布到 Pages 需要的权限，不多给
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布任务；新的推上来就把上一个还没发完的取消掉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # --mode ghpages 会走到 vite.config.ts 里那个分支，
      # 把 base 从 '/' 换成 '/Program2026/'。
      - name: 构建
        run: pnpm build --mode ghpages

      # GitHub Pages 是纯静态服务器：直接访问 /articles/xxx 会 404（磁盘上没这个文件）。
      # 把 index.html 复制一份叫 404.html，Pages 在找不到文件时就会返回它，
      # 页面加载后由前端路由接管，深链接和刷新都能用。
      - name: 生成 SPA 的 404 回退
        run: cp dist/index.html dist/404.html

      # ── 慢版：把 v0-naive 那个 tag 也构建一遍，塞进 /naive/ ───────────────
      # 【为什么在 CI 里构建，而不是本地构建好提交上去】
      # 构建产物进仓库会让仓库变胖（这里还带着 36 MB 原图），
      # 而且产物和源码容易对不上 —— 改了源码忘了重新构建，线上就是旧的。
      #
      # 【为什么单独检出到 naive-tree、单独装依赖】
      # v0-naive 的 lockfile 和现在不一样（那时候还没有 sharp / markdown-it / shiki）。
      # 共用一份 lockfile 会装出错的版本。worktree 让两个版本在同一个 runner 上互不干扰。
      - name: 取回慢版的那个 tag
        # actions/checkout 默认只拉一个 commit，tag 不在里面，得单独取
        run: git fetch --depth 1 origin tag v0-naive

      - name: 检出慢版到单独目录
        run: git worktree add --detach naive-tree v0-naive

      - name: 安装慢版的依赖
        working-directory: naive-tree
        run: pnpm install --frozen-lockfile

      # base 用 /Program2026/naive/：慢版自己的路由、图片、静态资源全挂在这个前缀下。
      # v0-naive 里图片地址走 src/lib/asset.ts 的 asset()，它读 import.meta.env.BASE_URL，
      # 所以换了 base 图片路径会自己跟着变，不用改一行源码。
      # 不用 `pnpm build`：那个脚本带 vue-tsc 类型检查，这里只要产物。
      - name: 构建慢版
        working-directory: naive-tree
        run: pnpm exec vite build --base=/Program2026/naive/

      # 字体是后面才加进项目的，v0-naive 里没有 public/fonts，
      # 但它的样式里已经写了 @font-face url('/fonts/...')。
      # 不补的话浏览器会去站点根找 /fonts/*.woff2 → 404 → 慢版掉回系统字体，
      # 那就不是「同一份内容」了。
      # CSS 里的绝对路径改成相对路径：css 在 /naive/assets/ 下，../fonts/ 正好落在
      # /naive/fonts/，不用在这里再写死一次前缀。
      - name: 给慢版补字体
        run: |
          mkdir -p naive-tree/dist/fonts
          cp public/fonts/*.woff2 naive-tree/dist/fonts/
          sed -i 's|url(/fonts/|url(../fonts/|g' naive-tree/dist/assets/*.css

      # 慢版进去就出不来，而且不能改它的源码（那是历史 tag 的产物）。
      # 于是在部署产物里注入「快版 / 慢版」开关：与快版同一份 HTML 结构 + 同一份 CSS
      # （读 src/styles/version-switch.css），只有高亮项不同。
      - name: 给慢版注入快版/慢版开关
        run: node scripts/inject-version-switch.mjs naive-tree/dist /Program2026/

      - name: 把慢版放进主站产物的 /naive/
        run: |
          mkdir -p dist/naive
          cp -r naive-tree/dist/. dist/naive/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
