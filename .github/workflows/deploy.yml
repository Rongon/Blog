# 把构建产物发布到 GitHub Pages。
#
# 【为什么用 Actions 而不是手动推 gh-pages 分支】
# 手动推的话，每次发版都要在本地 build 一次、再推一次构建产物；
# 构建产物进了仓库历史，仓库会越来越胖。
# 用 Actions 是「推代码 → 云端构建 → 发布」，仓库里只有源码。
#
# 【第一次用之前要做的事】
# 仓库 Settings → Pages → Source 选 **GitHub Actions**。只做一次。
#
# 【一次部署发布两套站点】
#   /Blog/        ← 主站（优化后）
#   /Blog/naive/  ← 慢版（优化前），用来看对比
# 两套在同一个产物里，所以同源、同一份 404 回退、同一次发布。
#
# 【慢版怎么做出来的：同一份源码，换一个 build mode】
# 早先的做法是检出 v0-naive 那个 tag 单独构建。代价是它的文案和结构停在了
# 优化前的那一天 —— 于是「快版 vs 慢版」同时差着两样东西：性能和内容，
# 读者分不清看到的差别是谁带来的。
# 现在慢版是 `--mode naive` 构建的：页面、文案、样式、组件树都是同一份源码，
# 只有十项优化被逐项关掉（静态路由 / 整包 Element Plus / 无 preload / 原图直出）。
# 这样两版之间唯一剩下的变量就是「优化加没加」。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一次运行
  workflow_dispatch:

# 发布到 Pages 需要的权限，不多给
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布任务；新的推上来就把上一个还没发完的取消掉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # --mode ghpages 会走到 vite.config.ts 里那个分支，
      # 把 base 从 '/' 换成 '/Blog/'。
      - name: 构建
        run: pnpm build --mode ghpages

      # GitHub Pages 是纯静态服务器：直接访问 /articles/xxx 会 404（磁盘上没这个文件）。
      # 把 index.html 复制一份叫 404.html，Pages 在找不到文件时就会返回它，
      # 页面加载后由前端路由接管，深链接和刷新都能用。
      - name: 生成 SPA 的 404 回退
        run: cp dist/index.html dist/404.html

      # ── 慢版：同一份源码，用 --mode naive 再构建一次，塞进 /naive/ ──────────
      # 【为什么在 CI 里构建，而不是本地构建好提交上去】
      # 构建产物进仓库会让仓库变胖（这里还带着 35.7 MB 原图），
      # 而且产物和源码容易对不上 —— 改了源码忘了重新构建，线上就是旧的。
      - name: 构建慢版
        run: pnpm exec vite build --mode naive

      # 慢版用的是 raw-images 里的原始 JPG，它们不在 public/ 下（否则会跟着主站发布）。
      # 拷进 dist-naive/images，路径规则和页面里写的 /images/xxx.jpg 一致。
      - name: 把原图拷进慢版产物
        run: node scripts/copy-naive-images.mjs

      # 慢版的入口文件叫 index.naive.html（另一个 HTML 入口），改名成 index.html 才能
      # 在 /naive/ 下当首页；再复制一份 404.html，让慢版的深链接也能刷新。
      - name: 整理慢版的入口文件
        run: |
          mv dist-naive/index.naive.html dist-naive/index.html
          cp dist-naive/index.html dist-naive/404.html

      - name: 把慢版放进主站产物的 /naive/
        run: |
          mkdir -p dist/naive
          cp -r dist-naive/. dist/naive/

      # 两版一致性检查：优化后 /Blog/ 与优化前 /Blog/naive/ 的**静态文字必须逐字相同**
      # （评论区除外 —— 它读线上真实数据，谁先留了言两边就会不一样）。
      # 不一致就让这次发布失败：宁可不发，也不发一个「差异不只是性能」的对照版，
      # 否则整个对照实验的说服力就没了。脚本零依赖，用 runner 自带的 Chrome。
      - name: 两版一致性检查
        run: pnpm check:parity

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
