# 把构建产物发布到 GitHub Pages。
#
# 【为什么用 Actions 而不是「部署分支」】
# 后者是经典方式：把打包结果提交到一个分支（比如 gh-pages），GitHub 直接发布那个分支。
# 那样产物会进 git 历史，每次构建都多一个 commit，仓库很快变得又大又乱。
# Actions 方式是「构建在服务器上跑、产物直接交给 Pages」，仓库里只留源码。
#
# 【这个文件在干什么】
# 两个 job：build 负责装依赖 + 打包 + 传产物，deploy 负责把产物发布出去。
# deploy 里的 environment.url 就是发布后的地址，跑完可以在 Actions 页面直接点。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一下就跑，调试时很有用
  workflow_dispatch:

# Pages 发布需要的权限。少一个都会失败，且报错信息不直观
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布。连推两次时，前一次没跑完的直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        # 用 build:ghpages 而不是 build：它会带上 `--mode ghpages`，
        # 让 vite.config.ts 里的 base 变成 `/Program2026/`。
        # GitHub Pages 把站点放在 /<仓库名>/ 这个子路径下，不带前缀的话资源全 404。
        run: pnpm build:ghpages

      # GitHub Pages 是静态托管，不认 SPA 的客户端路由：
      # 直接访问 /articles/xxx 这种深层地址时它会去找同名文件，找不到就返回 404。
      # 把 index.html 复制一份叫 404.html，GitHub 在找不到文件时就会返回它，
      # 于是路由重新回到前端手里，刷新深层页面就不会白屏。
      - name: SPA 兜底页
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
